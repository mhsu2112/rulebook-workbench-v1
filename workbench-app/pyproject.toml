[project]
name = "workbench"
version = "0.1.0"
description = "Rulebook Workbench prototype - M0 walking skeleton (model router, contracts, gates, storage)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "jsonschema>=4.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbench = ["contracts/*.json", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
