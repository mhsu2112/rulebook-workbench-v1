<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rulebook Workbench</title>
<style>

:root{
  --bg:#F7F5F0;--panel:#FFFFFF;--sunk:#FBFAF6;--ink:#1C2230;--ink2:#545B68;--muted:#8A909B;--line:#DAD6CC;--line2:#ECE8DF;
  --teal:#1F5F5B;--teal-ink:#FFFFFF;--teal-soft:#E4EFED;--amber:#9A5C00;--amber-soft:#FBF1E0;--amber-line:#E8CD9E;
  --green:#2F6B3A;--green-soft:#E6F0E6;--red:#8A3B2E;--red-line:#E3C9C4;
  --serif:'Iowan Old Style','Charter','Palatino Linotype','Book Antiqua',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#14171D;--panel:#1B1F27;--sunk:#171A21;--ink:#E7E4DC;--ink2:#A6ABB5;--muted:#7C828D;--line:#2F3541;--line2:#262B35;
  --teal:#5FB3AB;--teal-ink:#0F1A19;--teal-soft:#1B3331;--amber:#E3A54A;--amber-soft:#35291A;--amber-line:#5A4424;
  --green:#77C185;--green-soft:#1D3122;--red:#E59A8B;--red-line:#5A3430;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#14171D;--panel:#1B1F27;--sunk:#171A21;--ink:#E7E4DC;--ink2:#A6ABB5;--muted:#7C828D;--line:#2F3541;--line2:#262B35;
  --teal:#5FB3AB;--teal-ink:#0F1A19;--teal-soft:#1B3331;--amber:#E3A54A;--amber-soft:#35291A;--amber-line:#5A4424;
  --green:#77C185;--green-soft:#1D3122;--red:#E59A8B;--red-line:#5A3430;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:0 max(16px,2vw);height:58px;background:var(--panel);border-bottom:1px solid var(--line)}
.mark{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.switch{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;max-width:360px;min-width:0}
.switch .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:none}
.switch.xp .dot{background:var(--amber)}
.switch select{border:0;background:transparent;font-weight:600;min-width:0;max-width:210px;cursor:pointer}
.switch .mode{color:var(--ink2);white-space:nowrap}
.switch.xp .mode{color:var(--amber)}
.spacer{flex:1}
.toplink{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;padding:6px 8px;border-radius:6px;background:none;border:0;white-space:nowrap}
.toplink:hover,.toplink.on{background:var(--sunk);color:var(--ink)}
.chip{font-family:var(--mono);font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);white-space:nowrap}
.user{display:flex;align-items:center;gap:9px;font-size:13px;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.user small{display:block;color:var(--ink2);font-size:11px;line-height:1.2}
.protobar_unused{font-size:12px;color:var(--ink2);text-align:center;padding:6px 16px;border-bottom:1px solid var(--line2);background:var(--sunk)}
.protobar b{color:var(--ink);font-weight:600}
.xbar{display:flex;align-items:center;gap:10px;padding:8px max(16px,2vw);background:var(--amber-soft);border-bottom:1px solid var(--amber-line);color:var(--amber);font-size:13px;font-weight:500}
.xbar button{margin-left:auto;background:none;border:0;color:var(--amber);text-decoration:underline;font-weight:500}
.body{flex:1;display:flex;min-height:0}
.rail{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:flex-start;max-height:calc(100vh - 58px);overflow-y:auto;width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px}
.rail h6{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 10px 10px}
.step{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;font-size:14px;border:0;background:none;text-align:left;width:100%}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);flex:none;background:var(--panel)}
.step.done .n{background:var(--green);border-color:var(--green);color:var(--panel)}
.step.next .n{border:2px solid var(--teal);color:var(--teal)}
.step.locked{color:var(--muted)}
.step .meta{margin-left:auto;font-size:11px;color:var(--ink2);white-space:nowrap}
.step.locked .meta{color:var(--muted)}
.step:hover{background:var(--sunk)}
.step.on{background:var(--teal-soft);font-weight:600}
.railfoot{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:2px}
.railfoot .step{font-size:13px;color:var(--ink2)}
.railfoot .step.on{color:var(--ink)}
.railfoot .count{margin-left:auto;font-size:11px;background:var(--amber-soft);color:var(--amber);padding:1px 7px;border-radius:999px}
main{flex:1;min-width:0;padding:30px max(16px,3vw) 60px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:12px;color:var(--ink2)}
.crumb button{background:none;border:0;padding:0;color:var(--teal);font-size:12px}
.h1{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.01em;line-height:1.15;margin-top:4px}
.lead{color:var(--ink2);max-width:72ch;margin-top:8px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.card h3{font-size:13px;font-weight:600}
.card>header button{background:none;border:0;color:var(--teal);font-size:12px;padding:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid transparent;background:none;white-space:nowrap}
.btn.primary{background:var(--teal);color:var(--teal-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);border-color:var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--ink2)}
.btn.bad{background:var(--panel);border-color:var(--red-line);color:var(--red);font-weight:500}
.btn.amb{background:var(--amber);color:var(--panel)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.next{border-left:4px solid var(--teal);display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.next .lbl{color:var(--teal)}
.next h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:4px 0 6px}
.next p{color:var(--ink2);font-size:13px;max-width:62ch}
.next .acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.next .cost{font-size:12px;color:var(--ink2)}
.warn{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--ink);font-size:13px}
.warn svg{color:var(--amber);margin-top:2px}
.warn button{margin-left:auto;background:none;border:0;color:var(--amber);font-weight:600;text-decoration:underline;white-space:nowrap}
.ok{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--green-soft);color:var(--green);font-size:13px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px}
.tile .v{font-family:var(--serif);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .s{font-size:11px;color:var(--muted);margin-top:4px}
.tile.warnt .v{color:var(--amber)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.cols>*,.xp>*,.wrap>*{min-width:0}
.row .t,.desc,.src blockquote,td{overflow-wrap:anywhere}
.row{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line2);align-items:flex-start}
.row:first-of-type{border-top:0}
.id{font-family:var(--mono);font-size:12px;color:var(--teal);width:58px;flex:none;padding-top:1px}
.row .t{font-size:13px;line-height:1.45}
.row .d{font-size:11px;color:var(--muted);margin-top:3px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.doc:first-of-type{border-top:0}
.doc .ic{width:32px;height:32px;border-radius:6px;background:var(--sunk);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.doc .t{font-size:13px;font-weight:500}
.doc .d{font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);background:var(--sunk);white-space:nowrap}
.tag.teal{border-color:transparent;background:var(--teal-soft);color:var(--teal)}
.tag.amb{border-color:transparent;background:var(--amber-soft);color:var(--amber)}
.tag.grn{border-color:transparent;background:var(--green-soft);color:var(--green)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.flag td{background:var(--amber-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}

/* program list */
.plist .pr{display:grid;grid-template-columns:1fr 100px 170px 80px 110px;gap:16px;align-items:center;padding:13px 18px;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.plist .pr:first-of-type{border-top:0}
.plist .pr:hover{background:var(--sunk)}
.plist .lh{display:grid;grid-template-columns:1fr 100px 170px 80px 110px;gap:16px;padding:9px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:var(--sunk);border-radius:10px 10px 0 0}
.nm{font-weight:600}
.sc{font-size:12px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.dots i.done{background:var(--green)}
.dots i.cur{background:var(--teal)}

/* refactor */
.rf{display:grid;grid-template-columns:340px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);min-height:640px}
.queue{border-right:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;min-height:0}
.qhead{padding:16px 16px 10px}
.bar{height:6px;background:var(--line2);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.f{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink2)}
.f.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qlist{overflow-y:auto;max-height:720px}
.q{display:block;width:100%;text-align:left;padding:11px 16px;border:0;border-bottom:1px solid var(--line2);background:none}
.q:hover{background:var(--panel)}
.q .top2{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2)}
.q .st{margin-left:auto}
.q .st.accepted,.q .st.amended{color:var(--green)}
.q .st.rejected{color:var(--red)}
.q .st.parked{color:var(--amber)}
.q .t{font-size:13px;margin-top:3px;line-height:1.4}
.q.sel{background:var(--panel);box-shadow:inset 3px 0 0 var(--teal)}
.detail{padding:22px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.detail .k{font-family:var(--mono);font-size:12px;color:var(--teal)}
.detail h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.25;margin-top:3px}
.desc{color:var(--ink2);font-size:13.5px;max-width:78ch}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.src{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--panel)}
.src .who{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.src blockquote{font-family:var(--serif);font-size:15px;line-height:1.5;margin:8px 0 0;border-left:2px solid var(--line);padding-left:12px;white-space:pre-line}
.src .cite{font-size:11px;color:var(--green);margin-top:8px;display:flex;gap:5px;align-items:center}
.prop{border:1px solid var(--line);border-radius:10px;padding:15px 17px;display:flex;flex-direction:column;gap:12px}
.prop .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prop .txt{font-family:var(--serif);font-size:15.5px;line-height:1.5;background:var(--teal-soft);border-radius:6px;padding:10px 14px}
.prop textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;resize:vertical;background:var(--sunk)}
.effect{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12px;border:0;border-left:1px solid var(--line);background:var(--panel)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--teal);color:var(--teal-ink)}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acts .hint{margin-left:auto;font-size:12px;color:var(--muted)}
.err{color:var(--red);font-size:12px}
.guard{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;flex-wrap:wrap}
.guard b{color:var(--ink)}

.hb{display:flex;flex-direction:column;gap:8px}
.hbr{display:grid;grid-template-columns:minmax(150px,240px) 1fr 70px;gap:12px;align-items:center;font-size:13px}
.hbl{min-width:0}.hbl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbl small{display:block;font-size:11px;color:var(--muted)}
.hbt{height:12px;position:relative}.hbt i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:0 4px 4px 0}
.hbr:hover .hbt i{filter:brightness(1.15)}
.hbv{text-align:right;color:var(--ink)}
.bud{margin-top:14px}.budbar{position:relative;height:14px;background:var(--line2);border-radius:4px;overflow:hidden}
.budbar i{position:absolute;top:0;bottom:0}.budbar .spent{left:0;background:var(--teal)}.budbar .proj{background:repeating-linear-gradient(135deg,var(--teal) 0 3px,transparent 3px 6px);opacity:.7}
.budleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}.sw.spent{background:var(--teal)}.sw.proj{background:repeating-linear-gradient(135deg,var(--teal) 0 2px,transparent 2px 4px);border:1px solid var(--teal)}
@media (max-width:560px){.hbr{grid-template-columns:1fr 64px}.hbt{grid-column:1/-1;grid-row:2}}
.ivsteps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.ivsteps li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.ivsteps li .n{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:1.5px solid var(--line)}
.ivsteps li.done{color:var(--ink2)}.ivsteps li.done .n{background:var(--green);border-color:var(--green);color:var(--panel)}
.ivsteps li.cur{color:var(--ink);font-weight:600;border-color:var(--teal);background:var(--teal-soft)}.ivsteps li.cur .n{border:2px solid var(--teal);color:var(--teal)}
.ivgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}.ivgrid>*{min-width:0}
.ivchat{display:flex;flex-direction:column;padding:0}.ivchat>header{padding:16px 20px 0}
.msgs{height:520px;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.bub{max-width:86%;padding:10px 13px;border-radius:10px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.bub .who{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px;font-weight:600}
.bub.ai{background:var(--sunk);border:1px solid var(--line2);align-self:flex-start}
.bub.ai.now{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.bub.me{background:var(--teal-soft);align-self:flex-end}
.composer{padding:14px 20px 16px;display:flex;flex-direction:column;gap:10px}
.composer textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;resize:vertical;background:var(--panel)}
.composer .hint{margin-left:auto;font-size:11.5px;color:var(--muted)}
.dlist{margin:0;display:flex;flex-direction:column}
.dfield{padding:9px 0;border-top:1px solid var(--line2)}.dfield:first-child{border-top:0}
.dfield dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.dfield dd{margin:2px 0 0;font-size:13.5px}
.dfield.empty dd{color:var(--muted);font-style:italic}
@media (max-width:980px){.ivgrid{grid-template-columns:1fr}.msgs{height:420px}}
/* documents */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.dc h3{font-family:var(--serif);font-weight:500;font-size:19px}
.dc p{font-size:12.5px;color:var(--ink2)}
.dc .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:8px;flex-wrap:wrap}
.fmt{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--sunk)}
.fmt:hover{border-color:var(--teal);color:var(--teal)}
.dc .hash{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.dc.off{background:transparent;border-style:dashed}
.dc.off h3,.dc.off .eyebrow{color:var(--muted)}
.dc.feat{border-color:var(--teal)}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.pkc{display:flex;gap:14px;align-items:flex-start}
.pkc .ic{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.pkc h4{margin:0;font-size:14px}

var S = {
  route: { view: "home", pid: null }, err: "", busy: {}, programs: [], homeInfo: {}, archived: [],
  p: {},            // per-program cache: overview, purpose, interview, manifest, status, blueprint, refactor, policy, budget
  me: store("me") || null, ui: {}
};
function P() { var id = S.route.pid; if (!S.p[id]) S.p[id] = {}; return S.p[id]; }
function setErr(m) { S.err = m || ""; renderShell(); }
function toast(msg) { document.querySelectorAll(".toast").forEach(function (o) { o.remove(); }); var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }
function who() { return S.me || { name: "", role: "Program Owner" }; }

/* Run an action with a busy label on its button and an error bar on failure. */
function act(key, fn, okMsg) {
  if (S.busy[key]) return Promise.resolve();
  S.busy[key] = Date.now(); S.err = ""; render();
  var tick = setInterval(function () { var b = document.querySelector('[data-busy="' + key + '"] .secs'); if (b) b.textContent = Math.round((Date.now() - S.busy[key]) / 1000) + "s"; }, 1000);
  return Promise.resolve().then(fn).then(function (r) { if (okMsg) toast(okMsg); return r; })
    .catch(function (e) { S.err = e.message; })
    .then(function (r) { clearInterval(tick); delete S.busy[key]; render(); return r; });
}
function busyBtn(key, label, cls, attrs) {
  var b = S.busy[key];
  return '<button class="btn ' + (cls || "primary") + '" data-busy="' + key + '" ' + (attrs || "") + (b ? " disabled" : "") + '>' +
    (b ? '<span class="spin"></span> Working… <span class="secs">' + Math.round((Date.now() - b) / 1000) + 's</span>' : label) + '</button>';
}

/* ---------------- loaders ---------------- */
function loadOverview(pid) { return api("/api/programs/" + enc(pid) + "/overview").then(function (o) { S.p[pid] = S.p[pid] || {}; S.p[pid].overview = o; return o; }); }
function loadInto(key, path) { var pid = S.route.pid; return soft(api(path)).then(function (d) { S.p[pid] = S.p[pid] || {}; S.p[pid][key] = d; return d; }); }
function base() { return "/api/programs/" + enc(S.route.pid); }
function refresh(keys) {
  var pid = S.route.pid, jobs = [loadOverview(pid)];
  var map = { purpose: "/purpose", interview: "/interview", manifest: "/manifest", status: "/corpus/status", blueprint: "/blueprint",
    refactor: "/refactor", policy: "/policy", redesign: "/redesign", crosswalk: "/crosswalk" };
  var par = parentOf(pid);
  jobs.push(soft(api("/api/programs/" + enc(par) + "/explorations")).then(function (d) { S.p[par] = S.p[par] || {}; S.p[par].explorations = Array.isArray(d) ? d : []; }));
  (keys || []).forEach(function (k) {
    if (k === "budget") jobs.push(soft(api("/api/budget?pid=" + enc(pid))).then(function (d) { P().budget = d; }));
    else if (k === "models") jobs.push(soft(api("/api/models")).then(function (d) { S.models = d; }));
    else if (map[k]) jobs.push(loadInto(k, base() + map[k]));
  });
  return Promise.all(jobs);
}
var VIEW_NEEDS = {
  program: ["policy", "blueprint", "refactor", "manifest", "status"], purpose: ["purpose", "interview", "manifest"],
  corpus: ["manifest", "status", "blueprint", "policy"], distill: ["blueprint", "status", "manifest"], refactor: ["refactor", "blueprint", "manifest"],
  redesign: ["redesign"], target: [], align: ["crosswalk"], documents: ["purpose", "manifest", "blueprint"], log: [],
  settings: ["policy", "models", "budget"], explore: ["purpose", "blueprint"]
};

/* ---------------- routing ---------------- */
var VIEWS = ["program", "purpose", "corpus", "distill", "refactor", "redesign", "target", "align", "documents", "log", "settings", "explore"];
function parseHash() {
  var m = /^#\/p\/([^\/]+)(?:\/([a-z]+))?/.exec(location.hash || "");
  if (!m) return { view: "home", pid: null };
  var v = m[2] && VIEWS.indexOf(m[2]) >= 0 ? m[2] : "program";
  return { view: v, pid: decodeURIComponent(m[1]) };
}
function href(pid, view) { return "#/p/" + enc(pid) + (view && view !== "program" ? "/" + view : ""); }
function go(pid, view) { location.hash = pid ? href(pid, view) : "#/"; }
function onRoute() {
  S.route = parseHash(); S.err = ""; S.ui.menu = false;
  if (S.route.view === "home") { render(); loadHome(); window.scrollTo(0, 0); return; }
  var pid = S.route.pid;
  if (S.route.view === "explore" && branchOf(pid)) { go(parentOf(pid), "explore"); return; }
  render();
  refresh(VIEW_NEEDS[S.route.view] || []).then(render).catch(function (e) {
    S.err = e.status === 404 ? "There is no program called “" + pid + "”." : e.message; render();
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", onRoute);

function loadHome() {
  return Promise.all([api("/api/programs"), soft(api("/api/programs/archived"))]).then(function (r) {
    S.programs = r[0]; S.archived = Array.isArray(r[1]) ? r[1] : []; render();
    return Promise.all(S.programs.map(function (pid) {
      return soft(api("/api/programs/" + enc(pid) + "/overview")).then(function (o) { S.homeInfo[pid] = o; });
    }));
  }).then(render).catch(function (e) { setErr("Could not reach the Workbench: " + e.message); });
}

/* ---------------- program structure ---------------- */
function steps(o) {
  if (!o) return [];
  var st = {}; (o.stages || []).forEach(function (s) { st[s.key] = s; });
  var t = o.tabs || {}, red = o.mode === "redesign";
  var list = [{ view: "purpose", label: "Purpose", stage: st.purpose, open: true },
    { view: "corpus", label: "Source corpus", stage: st.corpus, open: !!t.corpus },
    { view: "distill", label: "Distill", stage: st.derived, open: !!t.derived }];
  if (red) {
    list.push({ view: "refactor", label: "Refactor", stage: st.refactor, open: !!t.refactor });
    list.push({ view: "redesign", label: "Redesign", stage: st.phase3, open: !!t.redesign });
  } else {
    list.push({ view: "refactor", label: "Refactor", stage: st.phase3, open: !!t.refactor });
  }
  list.push({ view: "target", label: "Target blueprint", stage: st.target, open: !!t.target });
  list.push({ view: "align", label: "Align", stage: st.align, open: !!t.target });
  var lastDone = -1;
  list.forEach(function (s, i) { s.done = !!(s.stage && s.stage.done); if (s.done) lastDone = i; });
  // A later step being done implies the earlier ones are behind us (older programs can
  // carry a stale flag on an earlier stage); "next" is the first undone step after it.
  list.forEach(function (s, i) { if (i < lastDone) s.done = true; });
  for (var i = lastDone + 1; i < list.length; i++) { if (!list[i].done) { list[i].next = true; break; } }
  return list;
}
function nextStep(o) { var l = steps(o); for (var i = 0; i < l.length; i++) if (l[i].next) return { s: l[i], n: i + 1, of: l.length }; return null; }
/* ---------------- explorations (ADR-019) ---------------- */
var XSEP = "~x-";
function branchOf(pid) { return String(pid || "").indexOf(XSEP) >= 0; }
function parentOf(pid) { return String(pid || "").split(XSEP)[0]; }
function inBranch() { return branchOf(S.route.pid); }
function branchInfo() { var o = P().overview; return o && o.exploration; }
/* Inside a branch any signed-in user may act in any role (ADR-019); the log records who. */
function roleFor(allowed) { var r = who().role; return (!inBranch() || allowed.indexOf(r) >= 0) ? r : allowed[0]; }

function policyState(pol) {
  if (!pol || pol.__error) return "unknown";
  if (pol.status !== "ratified") return "unlocked";
  return pol.pinned_models ? "pinned" : "unpinned";
}

/* ---------------- shell ---------------- */
function topbar() {
  var r = S.route, inProg = r.view !== "home", me = who();
  var sw = "";
  if (inProg && inBranch()) {
    var bi = branchInfo() || {};
    sw = '<a class="switch xsw" href="' + href(parentOf(r.pid), "explore") + '" title="Back to the explorations of ' + esc(parentOf(r.pid)) + '"><span class="dot"></span><b>' + esc(parentOf(r.pid)) + '</b><span class="mode">\u00b7 ' + esc(bi.label || "Exploration") + '</span></a>';
  } else if (inProg) {
    var ids = S.programs.length ? S.programs : [r.pid];
    if (ids.indexOf(r.pid) < 0) ids = ids.concat([r.pid]);
    sw = '<div class="switch"><span class="dot"></span><select id="progsel" aria-label="Program">' +
      ids.map(function (p) { return '<option value="' + esc(p) + '"' + (p === r.pid ? " selected" : "") + '>' + esc(p) + '</option>'; }).join("") +
      '</select><span class="mode">· Official record</span></div>';
  }
  var initials = (me.name || "?").split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
  return '<header class="top"><a class="mark" href="#/">Rulebook Workbench</a>' + sw + '<div class="spacer"></div>' +
    (inProg ? '<a class="toplink' + (r.view === "documents" || r.view === "log" ? " on" : "") + '" href="' + href(r.pid, "documents") + '">' + ic("doc") + '<span>Documents</span></a>' +
      '<a class="toplink' + (r.view === "explore" ? " on" : "") + '" href="' + href(parentOf(r.pid), "explore") + '">' + ic("branch") + '<span>Explorations</span></a>' : "") +
    '<a class="toplink" href="/reading-guide.html" target="_blank" rel="noopener">' + ic("help") + '<span>Guides</span></a>' +
    '<a class="toplink" href="/' + (inProg ? "#open=" + enc(r.pid) : "") + '" title="The previous interface, still available">' + '<span>Classic view</span></a>' +
    '<button class="usr" data-a="me" title="Change who is signed in"><div class="avatar">' + esc(initials) + '</div><div>' + esc(me.name || "Set your name") + '<small>' + esc(me.role) + '</small></div></button></header>';
}
function rail() {
  var r = S.route, o = P().overview, h = '<nav class="rail" aria-label="Program steps"><h6>Program steps</h6>';
  steps(o).forEach(function (s, i) {
    var cls = s.done ? "done" : (s.next ? "next" : (s.open ? "" : "locked"));
    var meta = s.done ? "done" : (s.next ? "next" : (s.open ? "" : ""));
    if (s.view === "refactor" && P().refactor && !P().refactor.__error && !s.done) {
      var rf = P().refactor; meta = rf.findings_processed + " / " + rf.findings_total;
    }
    h += '<a class="step ' + cls + (r.view === s.view ? " on" : "") + '" href="' + href(r.pid, s.view) + '"><span class="n">' + (s.done ? ic("check") : (i + 1)) + '</span>' + s.label + '<span class="meta">' + meta + '</span></a>';
  });
  if (!o) h += '<div class="small muted" style="padding:10px">Loading…</div>';
  h += '<div class="railfoot">' +
    '<a class="step' + (r.view === "program" ? " on" : "") + '" href="' + href(r.pid) + '">' + ic("home") + 'Program home</a>' +
    '<a class="step' + (r.view === "documents" || r.view === "log" ? " on" : "") + '" href="' + href(r.pid, "documents") + '">' + ic("doc") + 'Documents</a>' +
    '<a class="step' + (r.view === "explore" ? " on" : "") + '" href="' + href(parentOf(r.pid), "explore") + '">' + ic("branch") + 'Explorations' + (xCount() ? '<span class="count">' + xCount() + '</span>' : "") + '</a>' +
    '<a class="step' + (r.view === "settings" ? " on" : "") + '" href="' + href(r.pid, "settings") + '">' + ic("gear") + 'Settings</a></div></nav>';
  return h;
}
function xCount() { var l = (S.p[parentOf(S.route.pid)] || {}).explorations; return Array.isArray(l) ? l.length : 0; }
function crumb(t) {
  var mid = inBranch() ? '<a class="linkbtn" href="' + href(parentOf(S.route.pid), "explore") + '">' + esc(parentOf(S.route.pid)) + '</a> / <a class="linkbtn" href="' + href(S.route.pid) + '">' + esc((branchInfo() || {}).label || "Exploration") + '</a>'
    : '<a class="linkbtn" href="' + href(S.route.pid) + '">' + esc(S.route.pid) + '</a>';
  return '<div class="crumb"><a class="linkbtn" href="#/">All programs</a> / ' + mid + (t ? " / " + t : "") + '</div>';
}
function head(title, lead, crumbText) {
  return '<div>' + crumb(crumbText === undefined ? esc(title) : crumbText) + '<h1 class="h1">' + esc(title) + '</h1>' + (lead ? '<p class="lead">' + lead + '</p>' : "") + '</div>';
}
function renderShell() { render(); }
function render() {
  var r = S.route, h = topbar();
  if (r.view !== "home" && inBranch()) {
    var bi = branchInfo();
    if (bi) h += '<div class="xbar">' + ic("alert") + '<div><b>Exploration \u2014 not part of the official record.</b> ' + esc(bi.label) + ': ' + esc(bi.name) +
      ' \u00b7 changed ' + esc((bi.changed || {}).answer_id || "") + '. Decisions here are numbered EX-' + esc(String(bi.branch_id || "").toUpperCase()) + ' and are provisional.</div>' +
      '<a class="linkbtn" style="margin-left:auto;color:var(--amber);white-space:nowrap" href="' + href(parentOf(r.pid), "explore") + '">All explorations</a></div>';
  }
  if (r.view === "explore") h += '<div class="xbar">' + ic("branch") + '<div>Explorations run a copy of this program from one changed answer. Nothing in them touches the official record.</div></div>';
  if (S.err) h += '<div class="errbar" role="alert">' + ic("alert") + '<div>' + esc(S.err) + '</div><button data-a="dismiss-err">Dismiss</button></div>';
  if (r.view === "home") h += '<main>' + viewHome() + '</main>';
  else {
    var fn = { program: viewProgram, purpose: viewPurpose, corpus: viewCorpus, distill: viewDistill, refactor: viewRefactor,
      redesign: viewRedesign, target: viewTarget, align: viewAlign, documents: viewDocuments, log: viewLog, settings: viewSettings, explore: viewExplore }[r.view];
    var body;
    try { body = P().overview ? fn() : '<div class="wrap"><div class="empty"><span class="spin"></span> Loading ' + esc(r.pid) + '…</div></div>'; }
    catch (e) { body = '<div class="wrap"><div class="card"><b>This page could not be drawn.</b><p class="small dim">' + esc(e.message) + '</p></div></div>'; console.error(e); }
    h += '<div class="body">' + rail() + '<main>' + body + '</main></div>';
  }
  var focusId = document.activeElement && document.activeElement.id, selStart = null;
  try { if (focusId) selStart = document.activeElement.selectionStart; } catch (e) {}
  var keep = {};
  document.querySelectorAll("[data-keep]").forEach(function (el) { keep[el.id] = el.value; });
  $("app").className = (r.view !== "home" && inBranch()) ? "xmode" : "";
  $("app").innerHTML = h + (S.me ? "" : identityModal()) + (S.ui.modal ? S.ui.modal() : "");
  Object.keys(keep).forEach(function (id) { var el = $(id); if (el && el.hasAttribute("data-keep") && keep[id] != null) el.value = keep[id]; });
  if (focusId && $(focusId)) { var f = $(focusId); f.focus(); try { if (selStart != null) f.setSelectionRange(selStart, selStart); } catch (e) {} }
  var ps = $("progsel"); if (ps) ps.addEventListener("change", function () { go(ps.value, S.route.view === "home" ? null : "program"); });
  var ms = document.querySelector(".msgs"); if (ms && S.ui.scrollChat !== false) ms.scrollTop = ms.scrollHeight;
  afterRender.forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
}
var afterRender = [];

function identityModal() {
  var me = who();
  return '<div class="modal" role="dialog" aria-modal="true" aria-label="Who is using the Workbench"><form class="box" data-form="me">' +
    '<h2>Who’s using the Workbench?</h2><p class="small dim">Your name and role go on every decision you record. They are kept in this browser only.</p>' +
    '<div class="field"><label for="me-name">Your name</label><input id="me-name" required value="' + esc(me.name) + '" placeholder="e.g. Tristan Hall"></div>' +
    '<div class="field"><label for="me-role">Your role</label><select id="me-role">' + ROLES.map(function (x) { return '<option' + (x === me.role ? " selected" : "") + '>' + x + '</option>'; }).join("") + '</select>' +
    '<small>Ratifying needs the Program Owner role. Refactor decisions need Program Owner or Policy Reviewer.</small></div>' +
    '<div class="acts"><button class="btn primary" type="submit">Continue</button>' + (S.me ? '<button class="btn ghost" type="button" data-a="close-modal">Cancel</button>' : "") + '</div></form></div>';
}

/* ---------------- events ---------------- */
var ACTIONS = {}, FORMS = {};
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]"); if (!el) { if (S.ui.menu && !e.target.closest(".menu")) { S.ui.menu = false; render(); } return; }
  var fn = ACTIONS[el.getAttribute("data-a")];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("submit", function (e) {
  var f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  var fn = FORMS[f.getAttribute("data-form")]; if (fn) fn(f, e);
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.ui.modal) { S.ui.modal = null; render(); } });
ACTIONS["dismiss-err"] = function () { S.err = ""; render(); };
ACTIONS["me"] = function () { S.ui.modal = identityModal; render(); };
ACTIONS["close-modal"] = function () { S.ui.modal = null; render(); };
FORMS["me"] = function () {
  var n = $("me-name").value.trim(); if (!n) { $("me-name").focus(); return; }
  S.me = { name: n, role: $("me-role").value }; store("me", S.me); S.ui.modal = null; render();
};
function needRole(roles, what) {
  if (inBranch()) return true;       // ADR-019: roles are relaxed inside an exploration
  var me = who();
  if (roles.indexOf(me.role) >= 0) return true;
  S.err = what + " needs the " + roles.join(" or ") + " role. You are signed in as " + me.role + ". Change your role from your name at the top right.";
  render(); return false;
}
function val(id) { var el = $(id); return el ? el.value.trim() : ""; }
function download(name, text, mime) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime || "text/plain" }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv(rows, cols) {
  function q(v) { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  return [cols.join(",")].concat(rows.map(function (r) { return cols.map(function (c) { return q(r[c]); }).join(","); })).join("\n");
}

/* theme */
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme(store("theme") || "");

/* ---------------- Home ---------------- */
function viewHome() {
  var rows = S.programs.map(function (pid) {
    var o = S.homeInfo[pid];
    if (!o) return '<a class="pr" href="' + href(pid) + '"><div><div class="nm">' + esc(pid) + '</div><div class="sc muted">Loading…</div></div></a>';
    if (o.__error) return '<a class="pr" href="' + href(pid) + '"><div><div class="nm">' + esc(pid) + '</div><div class="sc">' + esc(o.__error) + '</div></div></a>';
    var l = steps(o), n = nextStep(o), done = l.filter(function (s) { return s.done; }).length;
    var dots = l.map(function (s) { return '<i class="' + (s.done ? "done" : (s.next ? "cur" : "")) + '"></i>'; }).join("");
    var last = (o.decisions || []).slice(-1)[0];
    var mode = o.mode === "redesign" ? "Redesign" : (o.mode === "refactor" ? "Refactor" : "Not set");
    return '<a class="pr" href="' + href(pid) + '"><div style="min-width:0"><div class="nm">' + esc(pid) + '</div><div class="sc">' + esc(o.scope || "Purpose not yet agreed") + '</div></div>' +
      '<div><span class="tag' + (o.mode === "redesign" ? " teal" : "") + '">' + mode + '</span></div>' +
      '<div class="hide-s">' + (n ? '<span style="font-size:13px">At <b>' + esc(n.s.label) + '</b></span>' : '<span style="color:var(--green);font-size:13px">Complete</span>') + '<div class="dots">' + dots + '</div></div>' +
      '<div class="hide-s num" style="font-family:var(--serif);font-size:19px">' + (o.decision_count || 0) + '</div>' +
      '<div class="hide-s small dim">' + (last ? day(last.timestamp) : "—") + '</div></a>';
  }).join("");
  var recent = null;
  S.programs.forEach(function (pid) {
    var o = S.homeInfo[pid]; if (!o || o.__error) return;
    var last = (o.decisions || []).slice(-1)[0]; if (!last) return;
    if (!recent || last.timestamp > recent.ts) recent = { pid: pid, ts: last.timestamp, id: last.entry_id, o: o };
  });
  var resume = "";
  if (recent) {
    var nx = nextStep(recent.o);
    resume = '<section class="card next"><div><div class="eyebrow lbl">Continue where you left off</div><h2>' + esc(recent.pid) + (nx ? ": " + esc(nx.s.label) : ": complete") + '</h2><p>Last decision ' + esc(recent.id) + ' on ' + day(recent.ts) + '.</p></div>' +
      '<div class="acts"><a class="btn primary" href="' + href(recent.pid, nx ? nx.s.view : "program") + '">Open ' + ic("arrow") + '</a></div></section>';
  }
  var newForm = S.ui.newProg ? '<form class="card" data-form="new-program"><div class="field"><label for="np-id">Short name for the program</label>' +
    '<input id="np-id" data-keep required pattern="[a-z0-9][a-z0-9_\\-]{1,63}" placeholder="e.g. uk-consumer-credit-reporting"><small>Lowercase letters, numbers and hyphens. It names the program’s folder and files.</small></div>' +
    '<div class="acts"><button class="btn primary" type="submit">Create and start the interview</button><button class="btn ghost" type="button" data-a="new-prog-cancel">Cancel</button></div></form>' : "";
  var arch = S.ui.showArchived && S.archived.length ? '<div class="card"><header><h3>Archived programs</h3></header>' + S.archived.map(function (a) {
    return '<div class="row"><div class="t" style="flex:1">' + esc(a) + '</div>' + busyBtn("restore-" + a, "Restore", "ghost sm", 'data-a="restore" data-pid="' + esc(a) + '"') + '</div>';
  }).join("") + '</div>' : "";
  return '<div class="wrap"><div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap"><div><h1 class="h1">Programs</h1><p class="lead">' +
    (S.programs.length ? S.programs.length + " active program" + (S.programs.length === 1 ? "" : "s") + ". Pick one up where it stands, or start a new one with the purpose interview." : "No programs yet. Start one with the purpose interview.") + '</p></div>' +
    '<div style="margin-left:auto;display:flex;gap:10px">' + (S.archived.length ? '<button class="btn ghost" data-a="toggle-archived">Archived (' + S.archived.length + ')</button>' : "") +
    '<button class="btn primary" data-a="new-prog">' + ic("plus") + 'New program</button></div></div>' + newForm + resume +

        return '<tr><td><b>' + esc(TASK_LABELS[t] || t) + '</b><div class="small muted">' + tags + '</div></td><td>' + ctl + '</td></tr>';
      }).join("");
      return rows ? '<div class="stage-h">' + g[0] + '</div><div class="tablewrap"><table class="dialtab"><tbody>' + rows + '</tbody></table></div>' : "";
    }).join("") + '</details>';
  }
  if (inBranch()) return '<div class="card"><header><h3>Models</h3><span class="tag amb">Set by ' + esc(parentOf(S.route.pid)) + '</span></header><p class="small dim" style="max-width:72ch">This exploration uses its program\u2019s model policy and cannot change it, so any difference from the official record comes from the changed answer alone.</p><div style="margin-top:12px">' + dials + '</div></div>';
  var foot = locked ? '<form data-form="reopen" class="field" style="margin-top:14px"><label for="po-why">Why re-open it?</label><textarea id="po-why" data-keep rows="2" required></textarea><div class="acts">' + busyBtn("reopen", "Re-open the policy", "ghost", 'type="submit"') + '</div></form>'
    : '<form data-form="lock" class="field" style="margin-top:14px"><label for="po-why">Rationale</label><textarea id="po-why" data-keep rows="2" required></textarea><div class="acts">' + busyBtn("lock", "Lock the model policy", "primary", 'type="submit"') + '<span class="small muted">Recorded as a decision in your name.</span></div></form>';
  return head_ + presets + '<div style="margin-top:12px">' + dials + '</div>' + foot + '</div>';
}
afterRender.push(function () {
  document.querySelectorAll("[data-a-dial]").forEach(function (sel) {
    if (sel.__w) return; sel.__w = true;
    sel.addEventListener("change", function () {
      var t = sel.getAttribute("data-a-dial"), v = sel.value === "__default__" ? null : sel.value;
      act("dial", function () { return api(base() + "/policy/override", "POST", { task_id: t, model: v }).then(function (p) { P().policy = p; }); });
    });
  });
});
ACTIONS["dials"] = function () { S.ui.dialsOpen = S.ui.dialsOpen === false; render(); };
ACTIONS["preset"] = function (el) {
  var p = el.dataset.p; if (p === "lab") { S.ui.pickLab = true; render(); return; }
  act("preset", function () { return api(base() + "/policy", "POST", { preset: p, lab: null }).then(function (r) { P().policy = r.policy; S.ui.pickLab = false; if ((r.notes || []).length) toast(r.notes.join(" ")); }); });
};
ACTIONS["lab"] = function (el) { act("preset", function () { return api(base() + "/policy", "POST", { preset: "lab", lab: el.dataset.l }).then(function (r) { P().policy = r.policy; }); }); };
FORMS["lock"] = function () {
  if (!needRole(["Program Owner"], "Locking the model policy")) return;
  var why = val("po-why");
  act("lock", function () { return api(base() + "/policy/ratify", "POST", { name: who().name, role: "Program Owner", rationale: why }).then(function (p) { P().policy = p; return refresh(["policy"]); }); }, "Model policy locked. Every task is pinned.");
};
FORMS["reopen"] = function () {
  if (!needRole(["Program Owner"], "Re-opening the model policy")) return;
  var why = val("po-why");
  act("reopen", function () { return api(base() + "/policy/reopen", "POST", { name: who().name, role: "Program Owner", rationale: why }).then(function (p) { P().policy = p; return refresh([]); }); }, "Model policy re-opened. Lock it again when ready.");
};
function hbars(rows, fmt) {
  var max = Math.max.apply(null, rows.map(function (r) { return r.v; }).concat([0.0001]));
  return '<div class="hb">' + rows.map(function (r) {
    return '<div class="hbr" title="' + esc(r.label) + ': ' + fmt(r.v) + '"><div class="hbl"><span>' + esc(r.label) + '</span>' + (r.sub ? '<small>' + esc(r.sub) + '</small>' : "") + '</div><div class="hbt"><i style="width:' + Math.max(0.6, r.v / max * 100) + '%"></i></div><div class="hbv num">' + fmt(r.v) + '</div></div>';
  }).join("") + '</div>';
}
function budgetPane() {
  var b = P().budget;
  if (!b || b.__error) return '<div class="card">' + esc(b && b.__error || "Loading…") + '</div>';
  var p = b.program || { by_task: [], total_usd: 0 }, pid = S.route.pid;
  var taskRows = p.by_task.map(function (t) { return { label: TASK_LABELS[t.task] || t.task, v: t.cost_usd, sub: (TASK_STEP[t.task] || "Other") + " · " + t.calls + " call" + (t.calls === 1 ? "" : "s") }; });
  var est = p.refactor_estimate_usd, open = p.refactor_open_defects;
  var budget = parseFloat((store("budget") || {})[pid]);
  var proj = p.total_usd + (est || 0), bud = "";
  if (budget > 0) {
    var pct = Math.min(100, p.total_usd / budget * 100), ppct = Math.min(100, proj / budget * 100);
    bud = '<div class="bud"><div class="budbar"><i class="spent" style="width:' + pct + '%"></i><i class="proj" style="left:' + pct + '%;width:' + Math.max(0, ppct - pct) + '%"></i></div><div class="budleg"><span><i class="sw spent"></i>Spent ' + money(p.total_usd) + '</span>' + (est ? '<span><i class="sw proj"></i>Refactor estimate ' + money(est) + '</span>' : "") +
      '<span style="margin-left:auto">' + (proj > budget ? '<b style="color:var(--red)">Over budget by ' + money(proj - budget) + '</b>' : money(budget - proj) + " left" + (est ? " after Refactor" : "")) + '</span></div></div>';
  }
  var progRows = b.programs.filter(function (x) { return !x.archived && x.known; }).map(function (x) { return { label: x.exploration ? x.parent + " \u00b7 Exploration " + x.program_id.split(XSEP)[1].toUpperCase() : x.program_id, v: x.cost_usd, sub: x.calls + " calls" + (x.exploration ? " \u00b7 not official" : "") }; });
  var archived = b.programs.filter(function (x) { return x.archived || !x.known; }).reduce(function (a, x) { return a + x.cost_usd; }, 0);
  if (archived) progRows.push({ label: "Archived and removed programs", v: archived, sub: "" });
  progRows.sort(function (a, c) { return c.v - a.v; });
  return '<div class="card"><header><h3>This program</h3><span class="kpi num">' + money(p.total_usd) + '</span></header><p class="small dim" style="margin-bottom:12px">Spend by model task, from the run log. Re-runs are included.</p>' + (taskRows.length ? hbars(taskRows, money) : '<p class="small muted">No model calls yet.</p>') +
    ((p.explorations || []).length ? '<div class="stage-h">Explorations (not included above)</div>' + hbars(p.explorations.map(function (x) { return { label: "Exploration " + x.program_id.split(XSEP)[1].toUpperCase(), v: x.cost_usd, sub: x.calls + " calls" }; }), money) : "") + '</div>' +
    '<div class="cols"><div class="card"><header><h3>Estimate to finish</h3></header><div class="tablewrap" style="border:0"><table><tbody>' +
    '<tr><td>Refactor proposals<div class="small dim">' + (open != null ? open + " defects without a proposal, at " + (b.refactor_per_defect_usd ? "about " + money(b.refactor_per_defect_usd) + " each (" + esc(b.refactor_basis) + ")" : "no past data") : "Available once Refactor opens") + '</div></td><td class="r num">' + (est != null ? "about " + money(est) : "—") + '</td></tr>' +
    '<tr><td>Later steps<div class="small dim">Depends on how many Refactor items are parked for Redesign</div></td><td class="r muted">estimated once Refactor is ratified</td></tr></tbody></table></div></div>' +
    '<form class="card" data-form="budget"><header><h3>Program budget</h3></header><div class="field"><label for="bud">Budget in US dollars (optional, kept in this browser)</label><div class="inline"><input id="bud" inputmode="decimal" value="' + (budget > 0 ? budget : "") + '" placeholder="e.g. 60" style="flex:1"><button class="btn ghost sm" type="submit">Set</button></div></div>' + (bud || '<p class="small muted" style="margin-top:10px">Set a budget to see spending and the Refactor estimate against it. Costs appear only on this page.</p>') + '</form></div>' +
    '<div class="card"><header><h3>All programs</h3><span class="kpi num">' + money(b.total_usd) + '</span></header>' + hbars(progRows, money) + '</div>';
}
FORMS["budget"] = function () { var all = store("budget") || {}; var v = parseFloat(val("bud")); if (v > 0) all[S.route.pid] = v; else delete all[S.route.pid]; store("budget", all); render(); };
function appearancePane() {
  var t = store("theme") || "";
  return '<div class="card"><header><h3>Theme</h3></header><div class="seg" role="group" aria-label="Theme">' + [["", "System"], ["light", "Light"], ["dark", "Dark"]].map(function (x) { return '<button class="' + (t === x[0] ? "on" : "") + '" data-a="theme" data-t="' + x[0] + '">' + x[1] + '</button>'; }).join("") + '</div></div>';
}
ACTIONS["theme"] = function (el) { store("theme", el.dataset.t); applyTheme(el.dataset.t); render(); };
function youPane() {
  var me = who();
  return '<form class="card" data-form="me-inline"><header><h3>Who you are</h3></header><p class="small dim">Your name and role go on every decision you record. They are kept in this browser only; the Workbench has no sign-in yet.</p>' +
    '<div class="row2"><div class="field"><label for="me2-name">Name</label><input id="me2-name" data-keep value="' + esc(me.name) + '" required></div><div class="field"><label for="me2-role">Role</label><select id="me2-role">' + ROLES.map(function (x) { return '<option' + (x === me.role ? " selected" : "") + '>' + x + '</option>'; }).join("") + '</select></div></div>' +
    '<div class="acts"><button class="btn primary" type="submit">Save</button></div></form>';
}
FORMS["me-inline"] = function () { var n = val("me2-name"); if (!n) return; S.me = { name: n, role: $("me2-role").value }; store("me", S.me); toast("Saved."); render(); };

/* ---------------- boot ---------------- */
onRoute();
api("/api/programs").then(function (ps) { S.programs = ps; render(); }).catch(function () {});

</script>
</body>
</html>
